# UE 配置模板：gnbSearchList 同时包含两个 gNB。
# 认证参数需与 5GC 中开通的订阅者一致（示例值对应 free5GC compose 的常用测试 USIM）。
# 本机/Open5GS 部署时把 gnbSearchList 改为 127.0.0.1（若两 gNB 使用不同回环地址则分别列出）。

supi: 'imsi-208930000000001'
mcc: '208'
mnc: '93'

key: '8baf473f2f8fd09487cccbd7097c6862'
op: '8e27b6af0e692e750f32667a3b14605d'
opType: 'OPC'
amf: '8000'
imei: '356938035643803'
imeiSv: '4370816125816151'

tunNetmask: '255.255.255.0'

gnbSearchList:
  - 10.100.200.101
  - 10.100.200.102

uacAic:
  mps: false
  mcs: false

uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 0x01
      sd: 0x010203

configured-nssai:
  - sst: 0x01
    sd: 0x010203

default-nssai:
  - sst: 0x01
    sd: 0x010203

integrity:
  IA1: true
  IA2: true
  IA3: true

ciphering:
  EA1: true
  EA2: true
  EA3: true

integrityMaxRate:
  uplink: 'full'
  downlink: 'full'
